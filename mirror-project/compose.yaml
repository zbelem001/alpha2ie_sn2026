# Miroir : architecture par couche (branche mirror-project).
# Depuis ce dossier (mirror-project/) :
#   docker compose up -d --build
# Banc X-Road en plus : ajouter --profile xroad.
#
# L'environnement d'origine (compose.yaml à la racine du dépôt) reste inchangé.
# Les deux utilisent les mêmes ports : arrêter l'un avant de lancer l'autre.
# Leurs conteneurs et volumes sont séparés (projets dlnuf et dlnuf-couches).
name: dlnuf-couches

include:
  - path: infrastructure/docker-compose.yml
    env_file: .env.example
  # Banc X-Road de la couche passerelle, inactif sans « --profile xroad »
  - path: passerelle/xroad/docker-compose.xroad.yml
    env_file: .env.example
