[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dlnuf-journal"
version = "0.1.0"
description = "Couche journal de traçabilité : événements chaînés, en ajout seul, recherche par citoyen, demande et date — Dites-le-nous une fois"
requires-python = ">=3.12"
# Le client (journal_client), installé par les couches qui écrivent au journal, n'a besoin que d'httpx.
# Le service (journal_service) : requirements.txt.
dependencies = ["httpx>=0.27,<1.0"]

[tool.setuptools.packages.find]
include = ["journal_service*", "journal_client*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
