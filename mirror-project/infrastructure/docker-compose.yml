# Architecture par couche (branche mirror-project) — Dites-le-nous une fois
#
# Copie de infrastructure/docker-compose.yml (branche main) qui construit les
# dossiers de couche (registres/, passerelle/, demarches/) du miroir.
# Depuis mirror-project/ (compose.yaml inclut ce fichier) :
#   docker compose up -d --build
#
# Mêmes ports que l'environnement d'origine (branche main) : arrêter l'un avant de lancer l'autre.
#
# Panne d'un registre (épreuve) :
#   docker compose stop justice-registry
#   docker compose start justice-registry
#
# Notifications simulées : boîte d'envoi sur http://localhost:8107
#
# Journal de traçabilité : http://localhost:8108 (lecture avec le jeton auditeur, voir journal/README.md)

name: dlnuf-couches

# Même Dockerfile pour les six registres. Pas de nom d'image commun : six
# constructions parallèles vers un même nom entrent en conflit. Les couches
# sont partagées par le cache, chaque registre a seulement sa propre étiquette.
x-registry: &registry
  build:
    context: ../registres
  restart: unless-stopped
  environment:
    REFERENCE_DATE: ${REFERENCE_DATE:-}
    SIMULATED_LATENCY_MS: ${SIMULATED_LATENCY_MS:-0}
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 5s

services:
  # --- Données et identité -----------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dlnuf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dlnuf-dev}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-dev}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-dlnuf}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-dlnuf-dev}
      KC_HEALTH_ENABLED: "true"
      # Adresse publique unique : l'émetteur (iss) des jetons est toujours
      # http://localhost:8180/realms/dlnuf, que le jeton soit demandé par le navigateur ou
      # par un conteneur (les interfaces joignent Keycloak par http://keycloak:8080).
      # L'API démarches n'accepte que cet émetteur (KEYCLOAK_ISSUER).
      KC_HOSTNAME: http://localhost:${KEYCLOAK_HOST_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "${KEYCLOAK_HOST_PORT:-8180}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

  keycloak-profile-init:
    build:
      context: ..
      dockerfile: demarches/Dockerfile
    command: ["python", "-m", "scripts.configure_keycloak"]
    restart: "no"
    environment:
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-dev}
      CITIZEN_DEMO_PHONE: ${TEST_PHONE_NUMBER:-}
      CITIZEN_DEMO_PHONE_VERIFIED: ${CITIZEN_DEMO_PHONE_VERIFIED:-false}
    depends_on:
      keycloak:
        condition: service_started

  keycloak-admin-client-init:
    build:
      context: ..
      dockerfile: demarches/Dockerfile
    command: ["python", "-m", "scripts.configure_keycloak_admin_client"]
    profiles: ["admin-setup"]
    restart: "no"
    environment:
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-dev}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-dlnuf}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-dlnuf-admin-api}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
    depends_on:
      keycloak:
        condition: service_started

  # --- Registres simulés (une image, six registres) -----------------------------------

  civil-registry:
    <<: *registry
    command: ["uvicorn", "registries.civil_registry.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8101:8000"

  transport-registry:
    <<: *registry
    command: ["uvicorn", "registries.transport_registry.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8102:8000"

  justice-registry:
    <<: *registry
    command: ["uvicorn", "mock_registry.justice.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8103:8000"

  oni-registry:
    <<: *registry
    command: ["uvicorn", "mock_registry.oni.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8106:8000"

  police-registry:
    <<: *registry
    command: ["uvicorn", "mock_registry.police.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8104:8000"

  treasury-registry:
    <<: *registry
    command: ["uvicorn", "mock_registry.treasury.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8105:8000"

  # --- Notifications simulées (même image) --------------------------------------------

  notifications:
    <<: *registry
    build:
      context: ../passerelle
    # Pas de journal d'accès : les URL du téléphone simulé contiennent le numéro.
    command: ["uvicorn", "notifications.app:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      SIMULATED_LATENCY_MS: ${SIMULATED_LATENCY_MS:-0}
      # Où transmettre les réponses SMS du citoyen (vide : le backend les lit par GET /replies).
      NOTIFICATION_REPLY_WEBHOOK_URL: ${NOTIFICATION_REPLY_WEBHOOK_URL:-}
    ports:
      # 8107 : le 8106 est pris par le registre ONI.
      - "8107:8000"

  # --- Journal de traçabilité (couche obligatoire) -------------------------------------
  # Événements chaînés, en ajout seul ; base « journal » créée au démarrage si elle manque.

  journal:
    build:
      context: ../journal
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dlnuf}:${POSTGRES_PASSWORD:-dlnuf-dev}@postgres:5432/journal
      # Jetons de démonstration (.env.example) : « couche=jeton », séparés par des virgules.
      JOURNAL_WRITE_TOKENS: demarches=${JOURNAL_TOKEN_DEMARCHES:-dev-journal-demarches},consentement-minimisation=${JOURNAL_TOKEN_CONSENTEMENT:-dev-journal-consentement}
      JOURNAL_READ_TOKENS: demarches=${JOURNAL_TOKEN_DEMARCHES:-dev-journal-demarches},auditeur=${JOURNAL_TOKEN_AUDITEUR:-dev-journal-auditeur}
    ports:
      - "8108:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  # --- Applications ----------------------------------------------------------------------

  demarches:
    build:
      context: ..
      dockerfile: demarches/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dlnuf}:${POSTGRES_PASSWORD:-dlnuf-dev}@postgres:5432/backend
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8180/realms/dlnuf}
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/dlnuf/protocol/openid-connect/certs
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-dlnuf-api}
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-dlnuf}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-dlnuf-admin-api}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      REGISTRY_CONNECTOR: ${REGISTRY_CONNECTOR:-direct}
      REGISTRY_TIMEOUT_S: ${REGISTRY_TIMEOUT_S:-3}
      XROAD_CLIENT_ID: ${XROAD_CLIENT_ID:-BF/GOV/ONI/CNIB}
      SMS_PROVIDER: ${SMS_PROVIDER:-simulated}
      OTP_SIMULATION_EXPOSE_CODE: ${OTP_SIMULATION_EXPOSE_CODE:-false}
      OTP_SIMULATION_SECRET: ${OTP_SIMULATION_SECRET:-}
      INFOBIP_OTP_API_KEY: ${INFOBIP_OTP_API_KEY:-}
      INFOBIP_SMS_API_KEY: ${INFOBIP_SMS_API_KEY:-}
      INFOBIP_BASE_URL: ${INFOBIP_BASE_URL:-}
      INFOBIP_SENDER: ${INFOBIP_SENDER:-}
      TEST_PHONE_NUMBER: ${TEST_PHONE_NUMBER:-}
      INFOBIP_2FA_APPLICATION_ID: ${INFOBIP_2FA_APPLICATION_ID:-}
      INFOBIP_2FA_CONSENT_MESSAGE_ID: ${INFOBIP_2FA_CONSENT_MESSAGE_ID:-}
      INFOBIP_2FA_REGISTRATION_MESSAGE_ID: ${INFOBIP_2FA_REGISTRATION_MESSAGE_ID:-}
      CITIZEN_IDENTIFIER_ENCRYPTION_KEY: ${CITIZEN_IDENTIFIER_ENCRYPTION_KEY:-}
      # Couche journal : chaque événement de dossier y est inscrit avant la validation de l'action.
      JOURNAL_URL: http://journal:8000
      JOURNAL_TOKEN: ${JOURNAL_TOKEN_DEMARCHES:-dev-journal-demarches}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      keycloak-profile-init:
        condition: service_completed_successfully
      journal:
        condition: service_healthy
      civil-registry:
        condition: service_healthy
      justice-registry:
        condition: service_healthy
      oni-registry:
        condition: service_healthy

  # --- Interfaces : espace usager (obligatoire) et guichet agent (bonus) -------------------
  # Applications Next.js : connexion Keycloak et relais vers l'API démarches côté serveur.

  espace-usager:
    build:
      context: ../espace-usager
    restart: unless-stopped
    environment: &interface-env
      BACKEND_URL: http://demarches:8000
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-dlnuf}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-dlnuf-api}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      demarches:
        condition: service_healthy

  guichet-agent:
    build:
      context: ../guichet-agent
    restart: unless-stopped
    environment: *interface-env
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      demarches:
        condition: service_healthy

volumes:
  postgres-data:
