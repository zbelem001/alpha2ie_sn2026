[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dlnuf-consentement-minimisation"
version = "0.1.0"
description = "Couche consentement et minimisation : registre des accords, et garde placée devant chaque registre (accord vérifié, réponse réduite à l'utile, journal) — Dites-le-nous une fois"
requires-python = ">=3.12"
# Le client (consent_client), installé par la couche démarches, n'a besoin que d'httpx.
# Le service (consent_service) : requirements.txt.
dependencies = ["httpx>=0.27,<1.0"]

[tool.setuptools.packages.find]
include = ["consent_service*", "consent_client*"]

[tool.setuptools.package-data]
consent_service = ["holders.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
