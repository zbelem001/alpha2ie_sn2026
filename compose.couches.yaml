# Architecture par couche (branche mirror-project) :
#   docker compose -f compose.couches.yaml up -d --build
# Banc X-Road en plus : ajouter --profile xroad.
#
# compose.yaml (dossiers d'origine) reste inchangé. Les deux environnements
# utilisent les mêmes ports : arrêter l'un avant de lancer l'autre. Leurs
# conteneurs et volumes sont séparés (projets dlnuf et dlnuf-couches).
name: dlnuf-couches

include:
  - path: infrastructure/docker-compose.couches.yml
    env_file: .env.example
  # Banc X-Road de la couche passerelle, inactif sans « --profile xroad »
  - path: passerelle/xroad/docker-compose.xroad.yml
    env_file: .env.example
