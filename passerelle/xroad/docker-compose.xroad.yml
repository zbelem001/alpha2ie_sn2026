# Banc de test X-Road (profil « xroad »), réservé au développement — couche passerelle.
# Inclus par compose.couches.yaml (architecture par couche).
#
#   docker compose -f compose.couches.yaml --profile xroad up -d                démarrer et configurer le banc
#   docker compose -f compose.couches.yaml --profile xroad logs -f xroad-setup  suivre la configuration
#   docker compose -f compose.couches.yaml --profile xroad run --rm xroad-setup reconfigurer à la main
#
# Topologie (détails : passerelle/xroad/README.md) :
#   xroad-cs       serveur central de l'instance BF
#   xroad-ca       autorité de certification de test, OCSP et horodatage
#   ss-registres   Security Server des administrations fournisseuses et services de gestion
#   ss-demandeurs  Security Server des administrations demandeuses (ONI, Fonction publique)
#
# Les noms de service sont les adresses inscrites dans la configuration globale :
# ne pas les renommer après la configuration.
#
# Images de test NIIS en version 7.8.3. Mots de passe de développement uniquement.

x-xroad-security-server: &security-server
  image: niis/xroad-security-server-sidecar:7.8.3-slim
  profiles: [xroad]
  restart: unless-stopped
  environment:
    XROAD_TOKEN_PIN: ${XROAD_TOKEN_PIN:-Secret1234}
    XROAD_ADMIN_USER: ${XROAD_ADMIN_USER:-xrd}
    XROAD_ADMIN_PASSWORD: ${XROAD_ADMIN_PASSWORD:-secret}
    XROAD_LOG_LEVEL: INFO
  mem_limit: 2560m
  healthcheck:
    test: ["CMD", "curl", "-fsk", "https://localhost:4000"]
    interval: 10s
    timeout: 5s
    retries: 60
    start_period: 60s

services:
  xroad-cs:
    image: niis/xroad-central-server:noble-7.8.3
    profiles: [xroad]
    restart: unless-stopped
    environment:
      # Connexion automatique au jeton de signature au démarrage. Sans elle, après
      # un redémarrage, le serveur central ne signe plus la configuration globale,
      # qui expire : plus aucun échange ne passe (global_conf_outdated).
      XROAD_TOKEN_PIN: ${XROAD_TOKEN_PIN:-Secret1234}
    volumes:
      - xroad-cs-config:/etc/xroad
      - xroad-cs-db:/var/lib/postgresql/16/main
      - xroad-cs-data:/var/lib/xroad
    ports:
      - "127.0.0.1:${XROAD_CS_ADMIN_PORT:-4100}:4000"
    mem_limit: 2560m
    healthcheck:
      test: ["CMD", "curl", "-fsk", "https://localhost:4000"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  xroad-ca:
    # Pas d'étiquette versionnée publiée : empreinte figée pour un banc reproductible.
    image: ghcr.io/nordic-institute/xrddev-testca@sha256:018e9f6ea04634ec61a3d44abee9a86d9dc4f6a2508296fd8db95d272c16c0c5
    profiles: [xroad]
    restart: unless-stopped
    volumes:
      # Clés de l'autorité, OCSP et horodatage : sans ce volume, recréer le conteneur
      # génère une nouvelle autorité et invalide tous les certificats déjà émis.
      - xroad-ca-home:/home/ca
      # Certificats publics, lus par xroad-setup.
      - xroad-ca-certs:/home/ca/certs
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8888/testca/certs"]
      interval: 5s
      timeout: 3s
      retries: 40

  ss-registres:
    <<: *security-server
    volumes:
      - ss-registres-config:/etc/xroad
      - ss-registres-db:/var/lib/postgresql/16/main
    ports:
      - "127.0.0.1:${XROAD_SS_REGISTRES_ADMIN_PORT:-4101}:4000"

  ss-demandeurs:
    <<: *security-server
    volumes:
      - ss-demandeurs-config:/etc/xroad
      - ss-demandeurs-db:/var/lib/postgresql/16/main
    ports:
      - "127.0.0.1:${XROAD_SS_DEMANDEURS_ADMIN_PORT:-4102}:4000"
      # Interface « système d'information » : là où le backend envoie ses requêtes X-Road
      # (XROAD_SECURITY_SERVER_URL=http://ss-demandeurs:8080 depuis un conteneur, http://localhost:8280 depuis la machine).
      - "127.0.0.1:${XROAD_SS_DEMANDEURS_CLIENT_PORT:-8280}:8080"

  xroad-setup:
    # Configuration automatique du banc par les API REST, lancée avec le profil :
    # le script attend lui-même les serveurs, configure ce qui manque, puis s'arrête
    # (« Banc X-Road prêt »). Relançable sans casse. En cas d'échec, Docker le relance
    # (trois fois au plus) : les étapes déjà faites sont sautées.
    build:
      context: ..
    profiles: [xroad]
    restart: on-failure:3
    command: ["python", "/xroad/setup_bench.py"]
    environment:
      XROAD_TOKEN_PIN: ${XROAD_TOKEN_PIN:-Secret1234}
      XROAD_ADMIN_USER: ${XROAD_ADMIN_USER:-xrd}
      XROAD_ADMIN_PASSWORD: ${XROAD_ADMIN_PASSWORD:-secret}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./configuration:/xroad:ro
      - xroad-ca-certs:/ca:ro
    # « started » et non « healthy » : `up -d` rend la main tout de suite au lieu
    # de bloquer pendant le démarrage des serveurs (5 à 9 minutes).
    depends_on:
      xroad-cs: { condition: service_started }
      xroad-ca: { condition: service_started }
      ss-registres: { condition: service_started }
      ss-demandeurs: { condition: service_started }

# Toute la configuration du banc est dans des volumes nommés : elle survit à
# `stop` / `start`, à `down` / `up` et à la recréation des conteneurs.
# Remise à zéro : supprimer les conteneurs X-Road puis TOUS ces volumes ensemble
# (commande dans passerelle/xroad/README.md). Jamais une partie seulement :
# serveur central, Security Servers et autorité de test se reconnaissent par leurs
# clés et leurs certificats.
volumes:
  xroad-ca-home:
  xroad-ca-certs:
  xroad-cs-config:
  xroad-cs-db:
  xroad-cs-data:
  ss-registres-config:
  ss-registres-db:
  ss-demandeurs-config:
  ss-demandeurs-db:
