[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dlnuf-registres"
version = "0.1.0"
description = "Couche registres : registres simulés (état civil, permis, justice, ONI, police, trésor) — Dites-le-nous une fois"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<0.120", "starlette>=0.46,<0.49", "uvicorn>=0.30", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.22", "httpx>=0.27", "PyYAML>=6"]

[tool.setuptools.packages.find]
include = ["registries*", "mock_registry*"]

[tool.setuptools.package-data]
"registries.civil_registry" = ["data/*.json"]
"registries.transport_registry" = ["data/*.json"]
"mock_registry.justice" = ["data/*.json"]
"mock_registry.police" = ["data/*.json"]
"mock_registry.treasury" = ["data/*.json"]
"mock_registry.oni" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
