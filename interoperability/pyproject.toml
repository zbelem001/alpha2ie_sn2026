[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dlnuf-interoperability"
version = "0.1.0"
description = "Connecteurs vers les registres et registres simulés — Dites-le-nous une fois"
requires-python = ">=3.12"
# Dépendances minimales : celles des connecteurs, que le backend installe.
dependencies = ["httpx>=0.27", "PyYAML>=6"]

[project.optional-dependencies]
registries = ["fastapi>=0.115,<0.120", "starlette>=0.46,<0.49", "uvicorn>=0.30", "pydantic>=2.7"]
dev = ["dlnuf-interoperability[registries]", "pytest>=8", "jsonschema>=4.22"]

[tool.setuptools.packages.find]
include = ["connectors*", "registries*", "mock_registry*"]

[tool.setuptools.package-data]
connectors = ["*.yaml"]
"registries.civil_registry" = ["data/*.json"]
"registries.transport_registry" = ["data/*.json"]
"mock_registry.justice" = ["data/*.json"]
"mock_registry.police" = ["data/*.json"]
"mock_registry.treasury" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
