# Environnement de développement — Dites-le-nous une fois
#
# Depuis la racine du dépôt (compose.yaml inclut ce fichier) :
#   docker compose up -d --build
#
# Panne d'un registre (épreuve) :
#   docker compose stop justice-registry
#   docker compose start justice-registry

name: dlnuf

# Même Dockerfile pour les six registres. Pas de nom d'image commun : six
# constructions parallèles vers un même nom entrent en conflit. Les couches
# sont partagées par le cache, chaque registre a seulement sa propre étiquette.
x-registry: &registry
  build:
    context: ../interoperability
  restart: unless-stopped
  environment:
    REFERENCE_DATE: ${REFERENCE_DATE:-}
    SIMULATED_LATENCY_MS: ${SIMULATED_LATENCY_MS:-0}
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 5s

services:
  # --- Données et identité -----------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dlnuf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dlnuf-dev}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-dev}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-dlnuf}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-dlnuf-dev}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_HOST_PORT:-8180}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

  keycloak-profile-init:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "scripts.configure_keycloak"]
    restart: "no"
    environment:
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-dev}
      CITIZEN_DEMO_PHONE: ${TWILIO_DEMO_TO:-}
    depends_on:
      keycloak:
        condition: service_started

  # --- Registres simulés (une image, six registres) -----------------------------------

  civil-registry:
    <<: *registry
    command: ["uvicorn", "registries.civil_registry.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8101:8000"

  transport-registry:
    <<: *registry
    command: ["uvicorn", "registries.transport_registry.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8102:8000"

  justice-registry:
    <<: *registry
    command: ["uvicorn", "mock_registry.justice.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8103:8000"

  oni-registry:
    <<: *registry
    command: ["uvicorn", "mock_registry.oni.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8106:8000"

  police-registry:
    <<: *registry
    command: ["uvicorn", "mock_registry.police.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8104:8000"

  treasury-registry:
    <<: *registry
    command: ["uvicorn", "mock_registry.treasury.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8105:8000"

  # --- Applications ----------------------------------------------------------------------
  #
  # frontend:                     # Personne 1
  #   build: ../frontend
  #   ports: ["3000:3000"]

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dlnuf}:${POSTGRES_PASSWORD:-dlnuf-dev}@postgres:5432/backend
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8180/realms/dlnuf}
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/dlnuf/protocol/openid-connect/certs
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-dlnuf-api}
      REGISTRY_CONNECTOR: ${REGISTRY_CONNECTOR:-direct}
      REGISTRY_TIMEOUT_S: ${REGISTRY_TIMEOUT_S:-3}
      XROAD_CLIENT_ID: ${XROAD_CLIENT_ID:-BF/GOV/ONI/CNIB}
      SMS_PROVIDER: ${SMS_PROVIDER:-simulated}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_API_KEY_SID: ${TWILIO_API_KEY_SID:-}
      TWILIO_API_KEY_SECRET: ${TWILIO_API_KEY_SECRET:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      TWILIO_DEMO_CITIZEN_REF: ${TWILIO_DEMO_CITIZEN_REF:-}
      TWILIO_DEMO_TO: ${TWILIO_DEMO_TO:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      keycloak-profile-init:
        condition: service_completed_successfully
      civil-registry:
        condition: service_healthy
      justice-registry:
        condition: service_healthy
      oni-registry:
        condition: service_healthy

volumes:
  postgres-data:
